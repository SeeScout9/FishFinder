<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AngelPlaner</title>
<style>
:root{--bg:#e9f6fb;--card:#fff;--tx:#0f3347;--mu:#5a7d8f;--ac:#0b8fd1;--ac2:#dff1fa;--bd:#cfe5f0;--ok:#2e9e5b;--rec:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b1c;--card:#152a2b;--tx:#e4f1ef;--mu:#8fb0ac;--ac:#3cc3cf;--ac2:#1b3c3e;--bd:#264647;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1b1c;--card:#152a2b;--tx:#e4f1ef;--mu:#8fb0ac;--ac:#3cc3cf;--ac2:#1b3c3e;--bd:#264647;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:620px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:0}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover,.opt.sel{border-color:var(--ac);background:var(--ac2)}
.opt small{display:block;color:var(--mu);margin-top:2px}
.badge{display:inline-block;background:var(--rec);color:#2b1d00;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn[disabled]{opacity:.4}
input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ac)}.chk.done label{text-decoration:line-through;color:var(--mu)}
.tag{font-size:12px;color:var(--ac);background:var(--ac2);border-radius:8px;padding:1px 7px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.ov{overflow-x:auto}svg{max-width:100%}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const FISH={
 hecht:{n:'Hecht',e:'🐊',bait:'Gummifisch 12–15 cm, Wobbler, Spinner Gr. 4',col:'Barsch-, Rotaugen- und Silberdekor; bei trübem Wasser Gelb/Feuerrot',tech:'Langsam führen, Stopps einbauen; Kanten und Schilf abwerfen',best:'Morgen- und Abenddämmerung; Herbst ist Top',peak:[7,18],gear:['Spinnrute 2,70 m / 20–60 g','Stahlvorfach 30–40 cm','Rollenfütterung 0,12 mm geflochten','Lösezange und Hakenlöser','Grosser Kescher']},
 egli:{n:'Egli (Barsch)',e:'🐟',bait:'Gummi-Shad 5–8 cm, Dropshot, Mini-Spinner, Tauwurm',col:'Natur, Perlmutt, Chartreuse bei Trübung',tech:'Dropshot nahe Grund; Schwärme vertikal anlaufen',best:'Vormittag bis früher Nachmittag',peak:[9,16],gear:['Leichte Spinnrute 2,10 m / 3–15 g','Fluorocarbon 0,20 mm','Dropshot-Haken Gr. 4–2','Kleine Köderbox']},
 zander:{n:'Zander',e:'🐠',bait:'Gummifisch 10–12 cm, Köderfisch auf Grund',col:'Weiss, Perlmutt, Motoroil; nachts Schwarz/Glow',tech:'Am Grund zupfen, Steinpackungen und Kanten abfischen',best:'Dämmerung bis Nacht',peak:[21,5],gear:['Rute 2,70 m / 10–40 g','Fluorocarbon-Vorfach 0,35 mm','Kopflampe mit Rotlicht','Jiggköpfe 10–21 g']},
 forelle:{n:'Forelle',e:'🎣',bait:'Spinner Gr. 1–3, kleine Wobbler, Wurm/Made',col:'Silber, Kupfer, Orange-Punkte',tech:'Quer zur Strömung abwerfen, einkurbeln lassen',best:'Früher Morgen, bewölkt nach Regen',peak:[6,19],gear:['Rute 2,10 m / 2–10 g','Monofil 0,18 mm','Polbrille','Watstiefel']},
 karpfen:{n:'Karpfen',e:'🐡',bait:'Boilies 16–20 mm, Mais, Tigernuss',col:'Hell/Gelb bei Sommer, Dunkel/Fisch bei Kälte',tech:'Grundmontage, Futterstelle über Tage aufbauen',best:'Nacht und Morgengrauen',peak:[23,5],gear:['Karpfenrute 3,60 m / 3 lb','Bissanzeiger','Abhakmatte','Rod-Pod oder Rutenhalter','Boilie-Vorrat']},
 felchen:{n:'Felchen',e:'🐟',bait:'Kleine Nymphen, Mini-Pilker, Teig am Hängerli',col:'Silber, Weiss, Perlmutt',tech:'Pilken in 10–25 m Tiefe',best:'Frühmorgen und Abend, Sommer',peak:[6,20],gear:['Pilkrute 2,40 m','Mehrere Hängerli','Echolot (falls Boot)']}
};
const SPOTS=[
 {id:'s1',n:'Zürichsee – Herrliberg/Küsnacht Ufer',lat:47.31,lng:8.61,f:['egli','hecht','felchen','zander'],r:'egli',w:'Seeufer, Steinschüttung'},
 {id:'s2',n:'Zürichhorn / Seebecken Zürich',lat:47.35,lng:8.55,f:['egli','hecht','karpfen'],r:'hecht',w:'Seebecken, Hafen'},
 {id:'s3',n:'Obersee – Seedamm Rapperswil',lat:47.23,lng:8.83,f:['hecht','zander','egli'],r:'zander',w:'Damm und Kanten'},
 {id:'s4',n:'Limmat – Höngg bis Dietikon',lat:47.40,lng:8.46,f:['forelle','egli','karpfen'],r:'forelle',w:'Fliessgewässer'},
 {id:'s5',n:'Greifensee – Uster Ufer',lat:47.37,lng:8.68,f:['hecht','egli','zander','karpfen'],r:'hecht',w:'Schilfgürtel'}
];
const BASE=['Gültiger Fischerpatent / Fischerkarte (Pflicht!)','Ausweis & Bargeld','Messer & Betäubungsschläger','Massband (Schonmasse prüfen)','Kescher','Lösezange / Hakenlöser','Fangbuch / Handy aufgeladen','Polbrille & Sonnenschutz','Wasser & Snacks','Regenjacke','Erste-Hilfe-Set & Pflaster','Müllsack (Natur sauber halten)'];
const EXTRA=['Powerbank','Kühltasche mit Eis','Schnurschere','Ersatzhaken & Ersatzvorfächer','Handtuch / Feuchttücher','Klappstuhl','Kopflampe','Insektenschutz'];
let S=JSON.parse('{"tab":"plan","step":1,"spot":null,"fish":[],"loc":null,"chk":{},"log":[]}');
try{const x=localStorage.getItem('angel');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function save(){try{localStorage.setItem('angel',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
function dist(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,h=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function score(f,h){const[a,b]=FISH[f].peak;const g=p=>{let d=Math.abs(h-p);d=Math.min(d,24-d);return Math.exp(-d*d/8)};const m=new Date().getMonth();const sea=[.5,.5,.65,.8,.9,.85,.7,.7,.85,.95,.7,.5][m];return Math.min(1,(.15+Math.max(g(a),g(b)))*sea)}
function chart(fs){const W=340,H=150,hr=new Date().getHours();let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Aktivität pro Stunde">`;
 const cols=['#0e7c86','#e08a00','#7a4fd1','#2e9e5b'];
 fs.slice(0,4).forEach((f,i)=>{let p='';for(let h=0;h<24;h++)p+=(h?'L':'M')+(10+h*13.1).toFixed(1)+' '+(H-score(f,h)*(H-12)).toFixed(1);s+=`<path d="${p}" fill="none" stroke="${cols[i]}" stroke-width="2.5"/>`});
 for(let h=0;h<24;h+=3)s+=`<text x="${10+h*13.1}" y="${H+14}" font-size="10" fill="currentColor" text-anchor="middle" opacity=".7">${h}h</text>`;
 s+=`<line x1="${10+hr*13.1}" x2="${10+hr*13.1}" y1="4" y2="${H}" stroke="currentColor" stroke-dasharray="3" opacity=".5"/><line x1="10" x2="${W-10}" y1="${H}" y2="${H}" stroke="currentColor" opacity=".3"/></svg>`;
 return s+'<div class="row" style="font-size:13px">'+fs.slice(0,4).map((f,i)=>`<span style="color:${cols[i]}">● ${FISH[f].n}</span>`).join('')+'</div>'}
function nowTip(f){const h=new Date().getHours();const sc=Math.round(score(f,h)*100);return sc>65?'🔥 Jetzt sehr aktiv ('+sc+'%)':sc>40?'👍 Jetzt mittel ('+sc+'%)':'😴 Jetzt eher ruhig ('+sc+'%)'}
const WB=[
{n:'Zürichsee',lat:47.25,lng:8.7,z:'ch',fi:{egli:90,hecht:70,felchen:60,zander:50}},
{n:'Bodensee',lat:47.6,lng:9.4,z:'ch',fi:{felchen:95,egli:85,hecht:60,forelle:50}},
{n:'Genfersee',lat:46.45,lng:6.55,z:'ch',fi:{egli:80,felchen:75,forelle:55,hecht:45}},
{n:'Vierwaldstättersee',lat:47.0,lng:8.4,z:'ch',fi:{egli:70,felchen:70,forelle:60}},
{n:'Neuenburgersee',lat:46.9,lng:6.85,z:'ch',fi:{egli:85,zander:70,hecht:65}},
{n:'Bielersee',lat:47.08,lng:7.15,z:'ch',fi:{egli:75,zander:60,hecht:60}},
{n:'Thunersee',lat:46.7,lng:7.75,z:'ch',fi:{forelle:75,egli:70,felchen:55}},
{n:'Walensee',lat:47.12,lng:9.2,z:'ch',fi:{forelle:80,egli:55,felchen:45}},
{n:'Greifensee',lat:47.35,lng:8.67,z:'ch',fi:{hecht:85,egli:80,zander:65,karpfen:50}},
{n:'Lago Maggiore',lat:46.1,lng:8.7,z:'ch',fi:{egli:70,hecht:55,karpfen:60}},
{n:'Limmat',lat:47.4,lng:8.46,z:'ch',fi:{forelle:60,egli:45,karpfen:50}},
{n:'Plattensee (HU)',lat:46.9,lng:17.7,z:'w',fi:{zander:95,karpfen:80,hecht:60}},
{n:'Ladogasee (RU)',lat:61,lng:31.5,z:'w',fi:{hecht:85,egli:90,zander:70}},
{n:'Baikalsee (RU)',lat:53.5,lng:108,z:'w',fi:{egli:60,hecht:55,forelle:40}},
{n:'Michigansee (US)',lat:44,lng:-87,z:'w',fi:{egli:80,forelle:75,hecht:55}},
{n:'Mjøsa (NO)',lat:60.8,lng:10.8,z:'w',fi:{forelle:85,egli:75,hecht:60}},
{n:'Loch Lomond (UK)',lat:56,lng:-4.6,z:'w',fi:{hecht:80,forelle:70}},
{n:'Biwa-See (JP)',lat:35.3,lng:136,z:'w',fi:{karpfen:85,egli:30}}];
function moon(){const d=(Date.now()-Date.UTC(2000,0,6,18,14))/864e5,P=29.530588,p=((d%P)+P)%P/P,il=Math.round((1-Math.cos(2*Math.PI*p))/2*100);return{ic:['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][Math.round(p*8)%8],il,t:il<10||il>90?'Neu-/Vollmond: oft starke Beissphasen':il>40&&il<60?'Halbmond: durchschnittlich':'Mittlere Mondphase'}}
function dens(w){return S.fs==='alle'?Math.max(...Object.values(w.fi)):(w.fi[S.fs]||0)}
const BAIT={Gummifisch:{hecht:1,zander:.9,egli:.5},Dropshot:{egli:1,zander:.5},Wobbler:{hecht:.9,forelle:.7,egli:.4},Spinner:{forelle:1,egli:.7,hecht:.5},Köderfisch:{zander:1,hecht:.8},Boilies:{karpfen:1},Pilker:{felchen:1,egli:.4}};
const HP=[['Zürichhorn',8.554,47.352,{egli:60,hecht:55,karpfen:50}],['Küsnacht',8.589,47.318,{egli:80,hecht:60,zander:40}],['Herrliberg',8.62,47.2935,{egli:90,hecht:55,felchen:60,zander:50}],['Meilen',8.6425,47.27,{egli:85,felchen:75,hecht:50}],['Thalwil',8.56,47.29,{egli:55,hecht:50,felchen:60}],['Horgen',8.597,47.26,{egli:70,zander:70,hecht:45}],['Wädenswil',8.67,47.23,{egli:65,felchen:80,zander:55}],['Stäfa',8.726,47.24,{egli:75,hecht:70,zander:60}],['Obersee',8.78,47.222,{hecht:70,zander:65,egli:50,felchen:40}],['Rapperswil',8.82,47.227,{hecht:90,zander:80,egli:60}],['Greifensee N',8.67,47.36,{hecht:85,egli:80,zander:65,karpfen:50}],['Greifensee S',8.685,47.335,{hecht:75,egli:70,zander:55}]];
function mapView(){S.fs=S.fs||'alle';const m=moon(),px=g=>((g-8.5)/.4*340).toFixed(1),py=a=>((47.4-a)/.22*260).toFixed(1);
 const hv=f=>{if(S.bt){let t=0;for(const k in BAIT[S.bt])t+=(f[k]||0)*BAIT[S.bt][k];return Math.min(100,t/1.1)}return S.fs==='alle'?Math.max(...Object.values(f)):(f[S.fs]||0)};
 const Q=HP.map(p=>({n:p[0],x:px(p[1]),y:py(p[2]),v:hv(p[3])})),top=Q.slice().sort((a,b)=>b.v-a.v)[0];
 const cl=[[8.54,47.36],[8.565,47.32],[8.585,47.295],[8.62,47.265],[8.67,47.245],[8.73,47.232],[8.78,47.222],[8.83,47.225]].map(p=>px(p[0])+','+py(p[1])).join(' ');
 let h=`<h1>🗺️ Fischkarte Zürichsee</h1><p class='sub'>Dunkelrot = am meisten Fisch (geschätzt).</p><div class='row'>${['alle',...Object.keys(FISH)].map(f=>`<button class='btn ${!S.bt&&S.fs===f?'':'sec'}' style='padding:6px 11px;font-size:13px' data-fs='${f}'>${f==='alle'?'Alle':FISH[f].n.split(' ')[0]}</button>`).join('')}</div><div class='row' style='margin:6px 0'><span class='sub'>Köder:</span>${Object.keys(BAIT).map(b=>`<button class='btn ${S.bt===b?'':'sec'}' style='padding:6px 11px;font-size:13px' data-bt='${b}'>${b}</button>`).join('')}</div>`;
 h+=`<svg viewBox='0 0 340 260' width='100%' style='border-radius:14px;display:block'><defs><radialGradient id='hh'><stop offset='0' stop-color='#8b0000'/><stop offset='.5' stop-color='#ff8a00' stop-opacity='.6'/><stop offset='1' stop-color='#ffe08a' stop-opacity='0'/></radialGradient><filter id='nz'><feTurbulence type='fractalNoise' baseFrequency='.05' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .08 0 0 0 0 .25 0 0 0 0 .08 0 0 0 .6 0'/></filter></defs><rect width='340' height='260' fill='#527f40'/><rect width='340' height='260' filter='url(#nz)'/><polygon points='200,0 340,0 340,90 250,60' fill='#8a9a4a' opacity='.45'/><polygon points='0,140 60,120 90,200 0,230' fill='#3d6a35' opacity='.5'/><ellipse cx='${px(8.54)}' cy='${py(47.372)}' rx='34' ry='20' fill='#a29d90' opacity='.75'/><polyline points='${cl}' fill='none' stroke='#0b2f55' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/><polyline points='${cl}' fill='none' stroke='#14679a' stroke-width='17' stroke-linecap='round' stroke-linejoin='round'/><ellipse cx='${px(8.677)}' cy='${py(47.348)}' rx='9' ry='28' fill='#14679a' stroke='#0b2f55' stroke-width='3'/>${Q.map(q=>`<circle cx='${q.x}' cy='${q.y}' r='${(14+q.v/4).toFixed(0)}' fill='url(#hh)' opacity='${(.25+q.v/140).toFixed(2)}'/>`).join('')}${Q.map(q=>`<text x='${+q.x+5}' y='${+q.y-4}' font-size='8' fill='#fff' stroke='#0008' stroke-width='.5' paint-order='stroke'>${q.n}</text>`).join('')}</svg><div style='display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0'>wenig<i style='flex:1;height:8px;border-radius:6px;background:linear-gradient(90deg,#ffe08a,#ff8a00,#8b0000)'></i>viel Fisch</div>`;
 h+=`<div class='card'><b>⭐ Beste Zone: ${top.n} (${Math.round(top.v)}%)</b><br><span class='sub'>${S.bt?S.bt+' wirkt hier am besten auf '+Object.keys(BAIT[S.bt]).map(k=>FISH[k].n).join(', '):(S.fs==='alle'?'Alle Fische':FISH[S.fs].n)}</span></div><div class='card'><b>${m.ic} Mond: ${m.il}% beleuchtet</b><br><span class='sub'>${m.t}</span></div><p class='sub'>Gezeichnete Karte im Satelliten-Look, kein echtes Foto. Echte Satellitenbilder: Datei angelplaner-komplett.html.</p>`;
 return h}
function mapViewOld(){S.rg=S.rg||'ch';S.fs=S.fs||'alle';const ch=S.rg==='ch',B=ch?[45.75,47.9,5.9,10.6]:[30,68,-100,145],m=moon();
 let l=WB.filter(w=>w.z==='ch'||!ch).filter(w=>!ch?w.z==='w':true).map((w,i)=>({w,d:dens(w),i:WB.indexOf(w)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
 let h=`<h1>🗺️ Gewässerkarte</h1><p class="sub">Je dunkler und grösser der Punkt, desto mehr Fisch (geschätzt).</p><div class="row"><button class="btn ${ch?'':'sec'}" data-rg="ch">Schweiz</button><button class="btn ${ch?'sec':''}" data-rg="w">Welt</button></div><div class="row" style="margin:8px 0">${['alle',...Object.keys(FISH)].map(f=>`<button class="btn ${S.fs===f?'':'sec'}" style="padding:6px 11px;font-size:13px" data-fs="${f}">${f==='alle'?'Alle':FISH[f].n.split(' ')[0]}</button>`).join('')}</div>`;
 h+=`<div class="card"><svg viewBox="0 0 340 200" width="100%" style="background:linear-gradient(135deg,#cfe0c4,#e9e6cf 55%,#c9dbe3);border-radius:10px"><defs><radialGradient id="hg"><stop offset="0" stop-color="#07265c" stop-opacity="1"/><stop offset=".45" stop-color="#1d5fa8" stop-opacity=".55"/><stop offset="1" stop-color="#5fb0e0" stop-opacity="0"/></radialGradient></defs>`+l.slice().reverse().map(x=>{const cx=(x.w.lng-B[2])/(B[3]-B[2])*340,cy=(B[1]-x.w.lat)/(B[1]-B[0])*200;return`<circle data-w="${x.i}" cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${ch?16+x.d/3.5:10+x.d/6}" fill="url(#hg)" opacity="${(.25+x.d/135).toFixed(2)}" ${S.wb==x.i?'stroke="#e0572f" stroke-width="1.5"':''} style="cursor:pointer"/>`}).join('')+`</svg><div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px">wenig<i style="flex:1;height:8px;border-radius:6px;background:linear-gradient(90deg,#cfe6f5,#1d5fa8,#07265c)"></i>viel Fisch</div></div>`;
 if(S.wb!=null&&WB[S.wb]){const w=WB[S.wb],top=Object.entries(w.fi).sort((a,b)=>b[1]-a[1]);h+=`<div class="card"><h3>${w.n}</h3>${top.map(([f,v])=>`<div style="font-size:14px;margin-top:6px">${FISH[f].e} ${FISH[f].n} · ${v}%<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}<p class="sub">Tipp: ${FISH[top[0][0]].bait.split(',')[0]} auf ${FISH[top[0][0]].n}. ${FISH[top[0][0]].best}.</p></div>`}
 h+=`<div class="card"><b>${m.ic} Mond heute: ${m.il}% beleuchtet</b><br><span class="sub">${m.t}</span></div><h2>Rangliste</h2>`+l.slice(0,8).map(x=>`<button class="opt ${S.wb==x.i?'sel':''}" data-w="${x.i}"><b>${x.w.n}</b> <span class="tag">${x.d}%</span></button>`).join('');
 return h}
function packlist(){const gear=new Set();S.fish.forEach(f=>FISH[f].gear.forEach(g=>gear.add(g)));return{base:BASE,fish:[...gear],extra:EXTRA}}
function chkRow(t){const c=!!S.chk[t];return`<div class="chk ${c?'done':''}"><input type="checkbox" ${c?'checked':''} data-c="${t.replace(/"/g,'&quot;')}"><label>${t}</label></div>`}
function view(){
 let h='';
 if(S.tab==='plan'){
  h+=`<div style='border-radius:18px;overflow:hidden;margin-bottom:12px;background:linear-gradient(#bfe6f7,#e9f7fc);position:relative'><svg viewBox='0 0 340 110' width='100%' style='display:block'><circle cx='290' cy='28' r='16' fill='#ffd45e'/><path d='M0 70 Q40 55 85 70 T170 70 T255 70 T340 70 V110 H0Z' fill='#4fb3d9'/><path d='M0 85 Q40 72 85 85 T170 85 T255 85 T340 85 V110 H0Z' fill='#1f8fc0'/><g transform='translate(70 72)'><ellipse rx='22' ry='10' fill='#ff9248'/><path d='M20 0 L36 -10 L36 10Z' fill='#ff7a2a'/><circle cx='-12' cy='-2' r='2' fill='#fff'/></g></svg><div style='position:absolute;left:14px;top:10px'><h1 style='margin:0;color:#073b5a'>🎣 AngelPlaner</h1><div style='color:#285a75;font-size:13px'>Planen · Karte · Fangbuch</div></div></div><p class="sub">Schritt ${S.step} von 4 · Spot, Fisch, Plan, Packliste</p>`;
  if(S.step===1){
   h+=`<h2>Wo möchtest du fischen?</h2><div class="row"><button class="btn" id="geo">📍 Standort teilen</button><span class="sub" id="gs">${S.loc?'Standort gesetzt':'oder Spot unten wählen'}</span></div>`;
   let sp=SPOTS.map(s=>({...s,d:S.loc?dist(S.loc[0],S.loc[1],s.lat,s.lng):null}));if(S.loc)sp.sort((a,b)=>a.d-b.d);
   const rec=sp.reduce((a,b)=>(S.loc?a.d<=b.d:true)?a:b,sp[0]);
   h+=sp.map(s=>`<button class="opt ${S.spot===s.id?'sel':''}" data-s="${s.id}"><b>${s.n}</b>${s.id===sp[0].id?'<span class="badge">⭐ Empfohlen</span>':''}<small>${s.w}${s.d!=null?' · '+s.d.toFixed(1)+' km entfernt':''} · ${s.f.map(f=>FISH[f].n).join(', ')}</small></button>`).join('');
   h+=`<button class="btn" id="n1" ${S.spot?'':'disabled'}>Weiter</button>`}
  if(S.step===2){const sp=SPOTS.find(x=>x.id===S.spot);
   h+=`<h2>Welcher Fisch?</h2><p class="sub">${sp.n} – wähle einen oder mehrere.</p>`;
   h+=sp.f.map(f=>`<button class="opt ${S.fish.includes(f)?'sel':''}" data-f="${f}"><b>${FISH[f].e} ${FISH[f].n}</b>${f===sp.r?'<span class="badge">⭐ Empfohlen</span>':''}<small>${nowTip(f)}</small></button>`).join('');
   h+=`<div class="row"><button class="btn sec" id="b">Zurück</button><button class="btn" id="n2" ${S.fish.length?'':'disabled'}>Plan erstellen</button></div>`}
  if(S.step===3){h+=`<h2>Dein Angelplan</h2>`;S.fish.forEach(f=>{const d=FISH[f];h+=`<div class="card"><h3>${d.e} ${d.n} <span class="tag">${nowTip(f)}</span></h3><p><b>Köder:</b> ${d.bait}</p><p><b>Farben:</b> ${d.col}</p><p><b>Technik:</b> ${d.tech}</p><p><b>Beste Zeit:</b> ${d.best}</p><p><b>Ausrüstung:</b> ${d.gear.join(', ')}</p></div>`});
   h+=`<div class="card"><h3>Aktivität heute</h3>${chart(S.fish)}</div><div class="row"><button class="btn sec" id="b">Zurück</button><button class="btn" id="n3">Packliste</button></div>`}
  if(S.step===4){const p=packlist();const all=[...p.base,...p.fish,...p.extra];const n=all.filter(t=>S.chk[t]).length;
   h+=`<h2>Packliste</h2><div class="bar"><i style="width:${n/all.length*100}%"></i></div><p class="sub">${n} von ${all.length} eingepackt</p><div class="card"><h3>Basis</h3>${p.base.map(chkRow).join('')}</div><div class="card"><h3>Für deine Fische</h3>${p.fish.map(chkRow).join('')}</div><div class="card"><h3>⭐ Extra-Tipps für Profis</h3>${p.extra.map(chkRow).join('')}</div><div class="row"><button class="btn sec" id="b">Zurück</button><button class="btn sec" id="rs">Neue Reise</button></div>`}
 }
 if(S.tab==='map')h+=mapView();
 if(S.tab==='act'){const all=Object.keys(FISH);h+=`<h1>📈 Fischaktivität</h1><p class="sub">Geschätzt nach Tageszeit und Jahreszeit (Beispielmodell).</p><div class="card"><b>${moon().ic} Mond: ${moon().il}% beleuchtet</b><br><span class="sub">${moon().t}</span></div><div class="card">${chart(S.fish.length?S.fish:['egli','hecht','zander','karpfen'])}</div>`;
  h+=all.map(f=>`<div class="card"><b>${FISH[f].e} ${FISH[f].n}</b> <span class="tag">${nowTip(f)}</span><br><span class="sub">${FISH[f].best}</span></div>`).join('')}
 if(S.tab==='log'){h+=`<h1>📓 Fangbuch</h1><p class="sub">Halte Fänge fest – dein persönliches Fish Brain.</p><div class="card"><select id="lf" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px">${Object.keys(FISH).map(f=>`<option value="${f}">${FISH[f].n}</option>`).join('')}</select><input type="text" id="ll" placeholder="Länge in cm" inputmode="numeric" style="margin-bottom:8px"><textarea id="ln" rows="2" placeholder="Köder, Spot, Notiz"></textarea><br><br><button class="btn" id="la">Fang speichern</button></div>`;
  h+=S.log.length?S.log.slice().reverse().map(l=>`<div class="card"><b>${FISH[l.f].e} ${FISH[l.f].n}</b> ${l.l?l.l+' cm':''}<br><span class="sub">${l.d} · ${l.n||''}</span></div>`).join(''):'<p class="sub">Noch keine Fänge.</p>'}
 if(S.tab==='info'){h+=`<h1>ℹ️ Hinweise</h1><div class="card"><p>Spots, Fischlisten und Aktivität sind Beispieldaten und Schätzungen, keine Live-Daten.</p><p>Beachte immer Patent, Schonzeiten, Schonmasse und Gewässerregeln des Kantons.</p></div>`}
 $('#app').innerHTML=h;
 $('#nav').innerHTML=[['plan','🎣','Planen'],['map','🗺️','Karte'],['act','📈','Aktivität'],['log','📓','Fangbuch'],['info','ℹ️','Info']].map(t=>`<button data-t="${t[0]}" class="${S.tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 save()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-bt],[data-w],[data-fs],[data-rg],[data-t],[data-s],[data-f],#n1,#n2,#n3,#b,#rs,#geo,#la');if(!t)return;
 if(t.dataset.t){S.tab=t.dataset.t}
 else if(t.dataset.w!=null){S.wb=+t.dataset.w}
 else if(t.dataset.fs){S.fs=t.dataset.fs;S.bt=null}
 else if(t.dataset.bt){S.bt=S.bt===t.dataset.bt?null:t.dataset.bt}
 else if(t.dataset.rg){S.rg=t.dataset.rg;S.wb=null}
 else if(t.dataset.s){S.spot=t.dataset.s;S.fish=[]}
 else if(t.dataset.f){const f=t.dataset.f;S.fish=S.fish.includes(f)?S.fish.filter(x=>x!==f):[...S.fish,f]}
 else if(t.id==='n1')S.step=2;else if(t.id==='n2')S.step=3;else if(t.id==='n3')S.step=4;
 else if(t.id==='b')S.step--;
 else if(t.id==='rs'){S.step=1;S.spot=null;S.fish=[];S.chk={}}
 else if(t.id==='geo'){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{S.loc=[p.coords.latitude,p.coords.longitude];view()},()=>{$('#gs').textContent='Standort nicht verfügbar'}):0;return}
 else if(t.id==='la'){S.log.push({f:$('#lf').value,l:$('#ll').value,n:$('#ln').value,d:new Date().toLocaleDateString('de-CH')})}
 view()});
document.addEventListener('change',e=>{if(e.target.dataset.c){S.chk[e.target.dataset.c]=e.target.checked;const y=scrollY;view();scrollTo(0,y)}});
view();
</script></body></html>
